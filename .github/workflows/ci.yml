name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  HUSKY: 0
  ASTRO_TELEMETRY_DISABLED: 1
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: npm ci
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Retrieve articles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RoRoche/articles
          ref: main
          path: .external/articles
          persist-credentials: false
      - run: npm run sync:articles -- .external/articles
      - name: ESLint (including Astro accessibility rules)
        run: npm run lint
      - name: Stylelint
        run: npm run lint:css
      - name: Prose lint (published articles)
        run: npm run lint:prose
      - name: Prettier
        run: npm run format:check
      - name: Astro Check
        run: npm run check
      - name: Tests
        run: npm run test:coverage
      - name: Dead-code and dependency usage
        run: npm run lint:dead-code
      - name: Build
        run: npm run build
      - name: Validate generated HTML
        run: npm run lint:html
      - name: UI, accessibility and visual regression tests
        run: npm run test:e2e
      - name: Lighthouse budgets
        run: npm run audit:lighthouse
