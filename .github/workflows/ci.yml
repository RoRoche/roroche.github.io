name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: npm ci
      - run: npm test
      - name: Retrieve articles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RoRoche/articles
          ref: main
          path: .external/articles
          persist-credentials: false
      - run: npm run sync:articles -- .external/articles
      - run: npm run check
      - run: npm run build
