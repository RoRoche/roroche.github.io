name: External links
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: npm ci
      - name: Retrieve article source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RoRoche/articles
          ref: main
          path: .external/articles
          persist-credentials: false
      - run: npm run sync:articles -- .external/articles
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --root-dir public --no-progress --max-concurrency 4 --max-retries 2 --retry-wait-time 2 README.md 'src/content/articles/**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
